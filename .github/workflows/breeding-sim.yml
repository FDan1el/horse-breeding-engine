name: Breeding Simulation

on:
  workflow_dispatch:
  push:
    paths:
      - 'breeding_sim.py'

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run simulation
        run: python3 breeding_sim.py
