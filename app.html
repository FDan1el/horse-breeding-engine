<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breeder Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bind:#2B1619; --bind-deep:#1B0D10; --leaf:#EDE7DB; --leaf-edge:#DCD3C2;
  --ink:#1B1613; --ink-soft:#6B6156; --brass:#B4894A; --turf:#46654B; --flag:#9E3324;
  --display:'Bitter',Georgia,serif; --body:'Archivo',-apple-system,sans-serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bind);color:var(--leaf);font-family:var(--body);
  line-height:1.5;padding-bottom:80px;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(180,137,74,.13),transparent 60%);}
.wrap{max-width:900px;margin:0 auto;padding:0 14px;}
header{padding:26px 14px 18px;border-bottom:2px solid var(--brass);}
.stamp{font-family:var(--data);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,34px);margin:8px 0 6px;line-height:1.05;}
h1 em{font-style:italic;font-weight:400;color:var(--brass);}
header p{margin:0;color:#C8BCAC;font-size:13px;}

.panel{background:var(--leaf);color:var(--ink);border-radius:2px;padding:16px;margin-top:16px;
  box-shadow:0 10px 24px -14px rgba(0,0,0,.7);}
.panel h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 12px;}

.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
label{display:block;font-family:var(--data);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
select{width:100%;padding:9px;background:#F7F3EA;color:var(--ink);
  border:1px solid var(--leaf-edge);border-radius:2px;font-size:14px;font-family:var(--body);}
.btn{display:block;width:100%;margin-top:12px;padding:14px;background:var(--bind);
  color:var(--leaf);border:none;border-radius:2px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:var(--body);}
.btn:active{background:#3A1E22;}
.btn:disabled{opacity:.45;}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--leaf-edge);margin-top:7px;}

.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;
  background:var(--leaf-edge);border:1px solid var(--leaf-edge);}
.cell{background:#F7F3EA;padding:10px 8px;}
.cell .k{font-family:var(--data);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.cell .v{font-family:var(--data);font-size:17px;font-weight:600;margin-top:3px;}
.v.pos{color:var(--turf);} .v.neg{color:var(--flag);}

.horse{border-bottom:1px solid var(--leaf-edge);padding:10px 0;}
.horse:last-child{border-bottom:0;}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.hname{font-family:var(--display);font-weight:600;font-size:15px;}
.hmeta{font-family:var(--data);font-size:11px;color:var(--ink-soft);}
.hbars{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.tag{font-family:var(--data);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;background:var(--ink-soft);color:var(--leaf);}
.tag.racer{background:#4A5A7A;} .tag.breeding{background:#7A5418;}
.tag.foal,.tag.yearling{background:#8A6B3A;} .tag.pensioned{background:#6B6156;}
.tag.retired_out{background:#9E3324;}
.hname{cursor:pointer;border-bottom:1px dotted var(--leaf-edge);}
.bt{font-family:var(--data);font-size:9px;letter-spacing:.06em;
  background:var(--brass);color:var(--bind-deep);padding:1px 5px;border-radius:2px;}
.pedrow{display:flex;gap:10px;padding:4px 0;font-size:13.5px;}
.pedrow .r{font-family:var(--data);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);width:42px;flex:none;padding-top:3px;}
.pedname{font-family:var(--display);font-weight:600;font-size:15px;}
.pedname.winner{text-transform:uppercase;font-weight:800;letter-spacing:.04em;}
.pedname.placed{font-weight:600;}
.lbrow{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px dotted var(--leaf-edge);font-size:13px;}
.lbrow:last-child{border-bottom:0;}
.lbnum{font-family:var(--data);color:var(--ink-soft);width:22px;}
.mare{border:1px solid var(--leaf-edge);padding:12px;margin-bottom:12px;background:#F7F3EA;}
.mareh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.studsel{width:100%;padding:9px;margin-top:8px;background:#fff;color:var(--ink);
  border:1px solid var(--leaf-edge);border-radius:2px;font-size:13px;font-family:var(--body);}
.vetbtn{margin-top:8px;padding:8px 12px;background:transparent;color:var(--ink);
  border:1px solid var(--leaf-edge);border-radius:2px;font-size:12.5px;cursor:pointer;
  font-family:var(--body);}
.warn{color:var(--flag);font-size:12px;margin-top:6px;}
.subh{font-family:var(--data);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);margin:14px 0 4px;}
.swatch{display:inline-block;width:11px;height:11px;border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);vertical-align:-1px;margin-right:4px;}

.log{background:#F7F3EA;border:1px solid var(--leaf-edge);padding:10px;
  max-height:340px;overflow-y:auto;font-size:12.5px;}
.ev{padding:3px 0;display:flex;gap:7px;}
.ev .t{font-family:var(--data);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--leaf);background:var(--ink-soft);padding:2px 5px;border-radius:2px;
  flex:none;height:fit-content;margin-top:2px;min-width:52px;text-align:center;}
.t.breed{background:#7A5418;} .t.race{background:#4A5A7A;} .t.vet{background:#9E3324;}
.t.retire{background:#46654B;} .t.money{background:#B4894A;color:var(--bind-deep);}
.t.exit{background:#3A2A2A;} .t.season{background:var(--bind);}
.t.money{background:#B4894A;color:var(--bind-deep);}

.note{font-size:12px;color:var(--ink-soft);margin-top:8px;}
.err{background:var(--flag);color:#fff;padding:10px;border-radius:2px;margin-top:12px;font-size:13px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header class="wrap">
  <div class="stamp">Breeder Tycoon · motor-teszt</div>
  <h1>Breeder <em>Tycoon</em></h1>
  <p>A valódi Python motorokat futtatja — nem böngészőben számol.</p>
</header>

<div class="wrap">

  <div class="panel">
    <h2>Vezérlés</h2>
    <div class="ctl">
      <div>
        <label>Takarmány</label>
        <select id="feed">
          <option value="rossz">Rossz</option>
          <option value="kozepes">Közepes</option>
          <option value="jo" selected>Jó</option>
          <option value="kivalo">Kiváló</option>
        </select>
      </div>
      <div>
        <label>Start / ló / szezon</label>
        <select id="starts">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="7">7</option>
        </select>
      </div>
      <div>
        <label>Hány szezon</label>
        <select id="seasons">
          <option value="1" selected>1</option>
          <option value="3">3</option>
          <option value="6">6</option>
        </select>
      </div>
    </div>
    <button class="btn" id="playBtn" disabled>Szezon lefuttatása</button>
    <button class="btn sec" id="newBtn">Új játék</button>
    <div id="err"></div>
  </div>

  <div class="panel" id="statePanel" style="display:none">
    <h2>Állapot</h2>
    <div class="ledger" id="ledger"></div>
    <p class="note" id="staff"></p>
  </div>

  <div class="panel" id="stablePanel" style="display:none">
    <h2>Állomány</h2>
    <div id="stable"></div>
  </div>

  <div class="panel" id="breedPanel" style="display:none">
    <h2>Fedeztetési terv</h2>
    <p class="note">Terv nélkül nincs fedeztetés. Válassz mént minden kancához.</p>
    <div id="breed"></div>
  </div>

  <div class="panel" id="pedPanel" style="display:none">
    <h2>Pedigré-lap</h2>
    <div id="ped"></div>
    <button class="btn sec" id="closePed">Bezárás</button>
  </div>

  <div class="panel" id="lbPanel" style="display:none">
    <h2>Ranglisták</h2>
    <div id="lb"></div>
  </div>

  <div class="panel" id="logPanel" style="display:none">
    <h2>Napló</h2>
    <div class="log" id="log"></div>
  </div>

</div>

<script>
const COAT = {Bay:'#7A4A2B',Chestnut:'#A85C2E',Black:'#2B2620',
              Gray:'#9A9A95',Grey:'#9A9A95',Palomino:'#D4B06A'};
const COAT_HU = {Bay:'Pej',Chestnut:'Sárga',Black:'Fekete',
                 Gray:'Szürke',Grey:'Szürke',Palomino:'Palomino'};
const STAGE_HU = {racer:'Versenyló',breeding:'Tenyészállat',yearling:'Yearling',
                  foal:'Csikó',pensioned:'Nyugdíjas',retired_out:'Lezárta'};

let SID = null;
const fmt = n => Math.round(n).toLocaleString('hu-HU').replace(/\u00A0/g,' ');

function showErr(msg){
  document.getElementById('err').innerHTML = msg ? `<div class="err">${msg}</div>` : '';
}

// A Render ingyenes szintje 15 perc tétlenség után elalszik, és az
// első kérés ~30 másodperc lehet. Ezért türelmes időkorlát és
// automatikus újrapróbálkozás.
const API_TIMEOUT_MS = 60000;

async function api(path, body, retries=1){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), API_TIMEOUT_MS);
  const opt = body
    ? {method:'POST', headers:{'Content-Type':'application/json'},
       body:JSON.stringify(body), signal:ctrl.signal}
    : {signal:ctrl.signal};
  try{
    const r = await fetch(path, opt);
    clearTimeout(timer);
    if(!r.ok){
      let msg = `A szerver ${r.status} hibát adott.`;
      try{ const j = await r.json(); if(j.error) msg = j.error; }catch(_){}
      // A Render ingyenes szintje ujraindulhat, ilyenkor a memoriaban
      // tarolt munkamenet elvesz. Ezt NEM hibakent kezeljuk.
      if(r.status === 404 && msg.includes('munkamenet')){
        const e = new Error(msg); e.sessionLost = true; throw e;
      }
      throw new Error(msg);
    }
    return r.json();
  }catch(e){
    clearTimeout(timer);
    if(retries > 0 && (e.name === 'AbortError' || e.message.includes('Failed to fetch'))){
      showErr('A szerver ébredezik, újrapróbálom…');
      await new Promise(r=>setTimeout(r, 3000));
      return api(path, body, retries-1);
    }
    if(e.name === 'AbortError')
      throw new Error('A szerver nem válaszolt időben. Próbáld újra.');
    throw e;
  }
}

function render(d){
  document.getElementById('statePanel').style.display='block';
  document.getElementById('stablePanel').style.display='block';

  const profit = d.money - 50000;
  document.getElementById('ledger').innerHTML = `
    <div class="cell"><div class="k">Szezon</div><div class="v">${d.season}</div></div>
    <div class="cell"><div class="k">Kassza</div><div class="v ${d.money>=50000?'pos':'neg'}">${fmt(d.money)}</div></div>
    <div class="cell"><div class="k">Eredmény</div><div class="v ${profit>=0?'pos':'neg'}">${profit>=0?'+':''}${fmt(profit)}</div></div>
    <div class="cell"><div class="k">Ló</div><div class="v">${d.totals.active}/${d.stable_capacity}</div></div>
    <div class="cell"><div class="k">Start</div><div class="v">${d.totals.starts}</div></div>
    <div class="cell"><div class="k">Győzelem</div><div class="v">${d.totals.wins}</div></div>
    <div class="cell"><div class="k">Csikó</div><div class="v">${d.totals.foals}</div></div>
    <div class="cell"><div class="k">Futam</div><div class="v">${d.totals.races_run}</div></div>
    <div class="cell"><div class="k">Black type</div><div class="v ${d.totals.black_type?'pos':''}">${d.totals.black_type}</div></div>
    <div class="cell"><div class="k">Prémium</div><div class="v pos">${fmt(d.totals.premiums)}</div></div>`;

  document.getElementById('staff').textContent =
    `Tréner: ${d.trainer} · Zsoké: ${d.jockey}`;

  document.getElementById('stable').innerHTML = d.horses.map(h=>{
    const c = COAT[h.colour]||'#8A8A85';
    const cn = h.colour_hu || COAT_HU[h.colour] || h.colour;
    const fb = h.fill_bar ? ` · sáv ${h.fill_bar}%` : '';
    const ped = h.sire ? `<div class="hmeta">${h.dam} × ${h.sire}</div>` : '';
    return `<div class="horse">
      <div class="hrow">
        <span class="hname" data-horse="${h.name}"><span class="swatch" style="background:${c}"></span>${h.name}${h.black_type?` <span class="bt">${h.black_type} BT</span>`:''}</span>
        <span class="tag ${h.stage}">${STAGE_HU[h.stage]||h.stage}</span>
      </div>
      <div class="hmeta">${h.grade} · ${cn} · ${h.age} év${fb} · ${h.starts} start / ${h.wins} győzelem · ${fmt(h.earnings)} B$</div>
      ${ped}
      <div class="hbars">${h.bars}</div>
    </div>`;
  }).join('') || '<p class="note">Nincs ló az állományban.</p>';
}

function renderLog(events){
  if(!events || !events.length) return;
  document.getElementById('logPanel').style.display='block';
  const el = document.getElementById('log');
  el.innerHTML = events.map(e=>
    `<div class="ev"><span class="t ${e.tag}">${e.tag}</span><span>${e.text}</span></div>`
  ).join('') + el.innerHTML;
}

async function startNewGame(quiet=false){
  const btn = document.getElementById('newBtn');
  btn.disabled = true; btn.textContent = 'Indítás…';
  try{
    const d = await api('/api/new', {feed_quality: document.getElementById('feed').value});
    SID = d.session_id;
    document.getElementById('log').innerHTML='';
    document.getElementById('lbPanel').style.display='none';
    document.getElementById('pedPanel').style.display='none';
    render(d);
    PLAN = {};
    loadBreeding();
    document.getElementById('playBtn').disabled = false;
    if(!quiet) showErr('');
  }catch(e){ showErr(e.message); }
  btn.disabled = false; btn.textContent = 'Új játék';
}

document.getElementById('newBtn').addEventListener('click', ()=>{
  showErr('');
  startNewGame();
});

document.getElementById('playBtn').addEventListener('click', async ()=>{
  showErr('');
  const btn = document.getElementById('playBtn');
  btn.disabled = true; btn.textContent = 'Számolás…';
  try{
    const d = await api('/api/season', {
      session_id: SID,
      feed_quality: document.getElementById('feed').value,
      starts: +document.getElementById('starts').value,
      seasons: +document.getElementById('seasons').value,
      plan: PLAN,
    });
    PLAN = {};
    render(d);
    renderLog(d.events);
    loadLeaderboards();
    loadBreeding();
  }catch(e){
    if(e.sessionLost){
      // a szerver ujraindult - csendben uj jatekot inditunk
      showErr('A szerver újraindult, a játékállás elveszett. Új játék indul…');
      await startNewGame(true);
    } else {
      showErr(e.message);
    }
  }
  btn.disabled = false; btn.textContent = 'Szezon lefuttatása';
});

// --- PEDIGRE-LAP ---
document.addEventListener('click', async ev=>{
  const el = ev.target.closest('.hname');
  if(!el || !SID) return;
  try{
    const p = await api(`/api/catalogue/${SID}/${encodeURIComponent(el.dataset.horse)}`);
    renderPed(p);
  }catch(e){ showErr(e.message); }
});

function btClass(v){ return v==='winner'||v==='classic'?'winner':(v==='placed'?'placed':''); }

function renderPed(p){
  const f=p.form, pr=p.progeny, fam=p.family;
  let html = `<div class="hrow"><span class="hname" style="font-size:19px">${p.name}</span>
    <span class="tag ${p.stage}">${STAGE_HU[p.stage]||p.stage}</span></div>
    <div class="hmeta">${p.colour_hu} · ${p.age} év</div>
    <div class="subh">Származás</div>
    <div class="pedrow"><span class="r">apja</span>
      <span class="pedname ${btClass(p.pedigree.sire_black_type)}">${p.pedigree.sire||'—'}</span></div>
    <div class="pedrow"><span class="r">anyja</span>
      <span class="pedname ${btClass(p.pedigree.dam_black_type)}">${p.pedigree.dam||'—'}</span></div>
    <div class="subh">Versenyforma</div>
    <div class="hmeta">${f.starts} start · ${f.wins} győzelem · ${f.places} helyezés ·
      ${fmt(f.earnings)} B$${f.black_type_wins?` · ${f.black_type_wins} black type`:''}${f.classic_wins?` · ${f.classic_wins} klasszikus`:''}</div>`;

  if(p.recent && p.recent.length){
    html += `<div class="subh">Utolsó futamok</div>`;
    html += p.recent.map(r=>`<div class="lbrow"><span>${r.track} · ${r.distance_f}f</span>
      <span>${r.position}. hely · ${fmt(r.earnings)} B$${r.black_type!=='none'?` <span class="bt">${r.black_type}</span>`:''}</span></div>`).join('');
  }
  if(pr){
    html += `<div class="subh">Utódok</div>
      <div class="hmeta">${pr.count} utód · ${pr.runners} futott · ${pr.winners} győztes
      ${pr.black_type?` · ${pr.black_type} black type`:''}${pr.is_blue_hen?' · <span class="bt">BLUE HEN</span>':''}</div>`;
    if(p.progeny_list && p.progeny_list.length){
      html += p.progeny_list.slice(0,8).map(k=>`<div class="lbrow">
        <span>${k.name}</span><span>${k.starts}st/${k.wins}gy · ${fmt(k.earnings)} B$</span></div>`).join('');
    }
  }
  if(fam){
    html += `<div class="subh">Női család</div>
      <div class="hmeta">${fam.offspring} utód · ${fam.black_type} black type ·
      ${fam.classic} klasszikus · ${fmt(fam.earnings)} B$</div>`;
  }
  document.getElementById('ped').innerHTML = html;
  const panel = document.getElementById('pedPanel');
  panel.style.display='block';
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('closePed').addEventListener('click', ()=>{
  document.getElementById('pedPanel').style.display='none';
});

// --- RANGLISTAK ---
let PLAN = {};

async function loadBreeding(){
  if(!SID) return;
  try{
    const d = await api(`/api/breeding/${SID}`);
    if(!d.length){ document.getElementById('breedPanel').style.display='none'; return; }
    document.getElementById('breed').innerHTML = d.map(m=>{
      const allowed = m.studs.filter(s=>s.allowed);
      const opts = allowed.map(s=>{
        const bt = s.black_type?` ${s.black_type}BT`:'';
        const own = s.own_stud?' [saját]':'';
        return `<option value="${s.stud_id}"${PLAN[m.mare_id]===s.stud_id?' selected':''}>
          ${s.name} · ${s.grade}${bt} · ${fmt(s.fee)} B$ · rokonság ${s.inbreeding}%${own}</option>`;
      }).join('');
      const vet = m.health_grade
        ? `<div class="hmeta">Állatorvosi: ${m.health_grade}</div>`
        : `<button class="vetbtn" data-mare="${m.mare_id}">Állatorvosi felmérés — ${fmt(m.vet_cost)} B$</button>
           ${m.blocked_by_vet?`<div class="warn">${m.blocked_by_vet} mén felmérést vár el.</div>`:''}`;
      return `<div class="mare">
        <div class="mareh">
          <span class="hname" data-horse="${m.mare}">${m.mare}</span>
          <span class="hmeta">${m.grade} · ${m.age} év · ~${m.foals_left} csikó</span>
        </div>
        <div class="hmeta">Vemhesülés: ${m.conception_label} (${m.conception_pct}%)</div>
        ${vet}
        <select class="studsel" data-mare="${m.mare_id}">
          <option value="">— nincs fedeztetés —</option>${opts}
        </select>
        <div class="hmeta" style="margin-top:5px">${allowed.length} mén választható
          ${m.studs.length-allowed.length?`· ${m.studs.length-allowed.length} elutasít`:''}</div>
      </div>`;
    }).join('');
    document.getElementById('breedPanel').style.display='block';
  }catch(e){
    if(e.sessionLost) document.getElementById('breedPanel').style.display='none';
  }
}

document.addEventListener('change', ev=>{
  const sel = ev.target.closest('.studsel');
  if(!sel) return;
  if(sel.value) PLAN[sel.dataset.mare] = sel.value;
  else delete PLAN[sel.dataset.mare];
});

document.addEventListener('click', async ev=>{
  const btn = ev.target.closest('.vetbtn');
  if(!btn || !SID) return;
  btn.disabled = true; btn.textContent = 'Vizsgálat…';
  try{
    await api('/api/vet', {session_id: SID, mare_id: btn.dataset.mare});
    await loadBreeding();
  }catch(e){ showErr(e.message); btn.disabled=false; }
});

async function loadLeaderboards(){
  if(!SID) return;
  try{
    const d = await api(`/api/leaderboards/${SID}`);
    if(!d.racing.length && !d.breeding.length) return;
    let html='';
    if(d.racing.length){
      html += `<div class="subh">Versenylovak — nyeremény szerint</div>`;
      html += d.racing.map((r,i)=>`<div class="lbrow"><span><span class="lbnum">${i+1}.</span>
        <span class="hname" data-horse="${r.name}">${r.name}</span></span>
        <span>${fmt(r.earnings)} B$ · ${r.starts}st/${r.wins}gy${r.black_type?` <span class="bt">${r.black_type} BT</span>`:''}</span></div>`).join('');
    }
    if(d.breeding.length){
      html += `<div class="subh">Tenyészállatok — ivadéksikeresség szerint</div>`;
      html += d.breeding.map((r,i)=>`<div class="lbrow"><span><span class="lbnum">${i+1}.</span>
        <span class="hname" data-horse="${r.name}">${r.name}</span></span>
        <span>${r.progeny} utód · ${r.winners} győztes${r.black_type?` <span class="bt">${r.black_type} BT</span>`:''}</span></div>`).join('');
    }
    document.getElementById('lb').innerHTML = html;
    document.getElementById('lbPanel').style.display='block';
  }catch(e){ /* csendes */ }
}

startNewGame();
</script>
</body>
</html>
