name: Breeding Simulation

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run breeding simulation
        run: python3 breeding_sim.py

      - name: Run feeding simulation
        run: python3 feeding_sim.py

      - name: Run trainer simulation
        run: python3 trainer_sim.py

